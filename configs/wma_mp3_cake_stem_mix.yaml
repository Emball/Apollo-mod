exp:
  dir: ./runs
  name: wma_mp3_cake_stem_mix

resume_checkpoint: null  # set to explicit .ckpt path to override auto-resume
resume: true  # auto-resume from latest checkpoint (including interrupted.ckpt) if present
seed: null  # integer = fixed random seed, null = off

optimizations:
  cudnn_benchmark: true
  expandable_segments: true
  triton_cache: true
  ram_limit_fraction: 0.98  # kill process cleanly at this fraction of total system RAM

training:
  n_layers_to_freeze: 0
  freeze_frontend: false
  val_songs: 6
  val_rotate_every: auto
  grad_accum_steps: 2

datas:
  cache_disk_reserve_gb: 2
  _target_: paired_datamodule.PairedAudioDataModule
  sr: 44100
  segment_sec: 3
  chunk_overlap: 0.0
  batch_size: 1
  num_workers: 1
  prefetch_factor: 1
  pin_memory: false
  val_bootstrap_chunks: 15
  align_data: false  # integer = fixed offset in samples (+ trims LQ, - trims HQ), false = off
  cache_retention_days: 30  # days a cached chunk set or converted file can go unused before it is deleted at startup, 0 = keep everything
  stem_mix:
    directory: data/wma_mp3_cake_stem_mix/hdf5
    num_samples: 40000
  compression:
    enabled: true
    recipe: utils/degrade/stfl.json
    seed: 0
    pad_sec: 1.0
    workers: 2
  augmentation:
    live:
      enabled: false
      stereo_alternation:
        enabled: true
        prob: 1.0
      mid_side_isolation:
        enabled: false
        prob_mid: 0.1
        prob_side: 0.1
      gain:
        enabled: true
        prob: 0.5
        db_max: 1.5
      deep_gain:
        enabled: true
        prob: 0.03
        db_min: -10.0
        db_max: -6.0
      silence_dip:
        enabled: true
        prob: 0.05
        max_hold_sec: 2.0
        short_ramp_ms: 10.0
        short_ramp_max_ms: 50.0
        medium_ramp_ms: 50.0
        medium_ramp_max_ms: 200.0
        long_ramp_ms: 200.0
        long_ramp_max_ms: 1000.0
      polarity:
        enabled: false
        prob: 0.5
    cached:
      enabled: false
      stereo_alternation:
        enabled: false
        fraction: 1.0
      gain:
        enabled: false
        fraction: 0.5
        db_max: 1.5
      polarity:
        enabled: false
        fraction: 0.5

model:
  _target_: look2hear.models.apollo.Apollo
  sr: 44100
  win: 20
  feature_dim: 256
  layer: 6

discriminator:
  _target_: look2hear.discriminators.frequencydis.MultiFrequencyDiscriminator
  nch: 2
  window: [32, 64, 128, 256, 512, 1024, 2048]
  window_weight_boost: false

optimizer:
  type: AdamW
  lr_g: 0.000003
  lr_d: 0.000001
  weight_decay: 0.01
  betas_g: [0.9, 0.999]
  betas_d: [0.5, 0.99]

scheduler_g:
  _target_: torch.optim.lr_scheduler.StepLR
  step_size: 2
  gamma: 0.98

scheduler_d:
  _target_: torch.optim.lr_scheduler.StepLR
  step_size: 2
  gamma: 0.98

loss_g:
  _target_: look2hear.losses.gan_losses.MultiFrequencyGenLoss
  eps: 1e-8
  band_weight_shape: gaussian
  band_weight_center_hz: 15000.0
  band_weight_sigma_hz: 3000.0
  band_weight_gain: 0.0  # 0 = flat
  band_weight_lo_hz: 4500.0
  band_weight_hi_hz: 18500.0
  band_weight_ramp_hz: 1500.0

loss_d:
  _target_: look2hear.losses.gan_losses.MultiFrequencyDisLoss
  eps: 1e-8

metrics:
  _target_: look2hear.losses.MultiSrcNegSDR
  sdr_type: sisdr

system:
  _target_: look2hear.system.audio_litmodule.AudioLightningModule
  gradient_checkpointing: true
  activation_cpu_offload: false
  validation_overlap_add: true
  visqol_fraction: 1.0

checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  verbose: true
  save_last: false
  keep_best: 6  # prune to the best N by visqol (per val set) plus the latest M; 0 = keep everything
  keep_latest: 2

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  name: ""
  version: ""
  log_graph: false

trainer:
  _target_: pytorch_lightning.Trainer
  devices: [0]
  max_epochs: 1500
  accelerator: cuda
  precision: 16-mixed
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  fast_dev_run: false
  val_check_interval: 1000
  check_val_every_n_epoch: null
