exp:
  dir: ./Exps
  name: Apollo

optimizations:
  tf32: true
  cudnn_benchmark: true
  expandable_segments: true
  triton_cache: true
training:
  n_layers_to_freeze: 4
  hf_boost: 1.5
  val_save_interval: 2
  val_audio_pairs: 5
  grad_accum_steps: 1

datas:
  _target_: paired_datamodule.PairedAudioDataModule
  train_dir: ./chunks/train
  eval_dir: ./chunks/val
  sr: 44100
  segment_sec: 4
  batch_size: 2
  num_workers: 8
  pin_memory: true
  val_bootstrap_chunks: 15
  # Experimental: per-chunk xcorr alignment.
  # Corrects random sub-second LQ/HQ timing jitter at the chunk level.
  # Does a single global speed-correction resample first, then shifts each
  # LQ chunk window independently by its xcorr offset against the HQ chunk.
  # Enable when LQ/HQ pairs have drifting alignment that global correction can't fix.
  chunk_align: false
  chunk_align_max_shift_ms: 80  # search window ±ms around each chunk
  augmentation:
    live:
      enabled: true
      mono_channel:
        enabled: false
        prob: 1.0
      gain:
        enabled: true
        prob: 0.5
        db_max: 1.5
      polarity:
        enabled: true
        prob: 0.5
      pitch_shift:
        enabled: true
        prob: 0.5
        semitones_max: 1.5
      noise:
        enabled: true
        prob: 0.5
        sigma: 0.002
      mp3_degradation:
        enabled: true
        prob: 0.5
        kbps_min: 64
        kbps_max: 256
    cached:
      enabled: false
      cached_variants: 1
      mono_channel:
        enabled: true
        fraction: 1.0
      gain:
        enabled: false
        fraction: 0.5
        db_max: 1.5
      polarity:
        enabled: false
        fraction: 0.5
      pitch_shift:
        enabled: false
        fraction: 0.5
        semitones_max: 1.5
      noise:
        enabled: false
        fraction: 0.5
        sigma: 0.002
      mp3_degradation:
        enabled: false
        fraction: 0.5
        kbps_min: 64
        kbps_max: 256

model:
  _target_: look2hear.models.apollo.Apollo
  sr: 44100
  win: 20
  feature_dim: 256
  layer: 6

discriminator:
  _target_: look2hear.discriminators.frequencydis.MultiFrequencyDiscriminator
  nch: 2
  window: [32, 64, 128, 256, 512, 1024, 2048]

optimizer:
  type: adamw_8bit
  lr_g: 0.00001
  lr_d: 0.000001
  weight_decay: 0.01
  betas_g: [0.9, 0.999]
  betas_d: [0.5, 0.99]

scheduler_g:
  _target_: torch.optim.lr_scheduler.StepLR
  step_size: 2
  gamma: 0.98

scheduler_d:
  _target_: torch.optim.lr_scheduler.StepLR
  step_size: 2
  gamma: 0.98

loss_g:
  _target_: look2hear.losses.gan_losses.MultiFrequencyGenLoss
  eps: 1e-8

loss_d:
  _target_: look2hear.losses.gan_losses.MultiFrequencyDisLoss
  eps: 1e-8

metrics:
  _target_: look2hear.losses.MultiSrcNegSDR
  sdr_type: sisdr

system:
  _target_: look2hear.system.audio_litmodule.AudioLightningModule
  gradient_checkpointing: true
  grad_accum_steps: ${training.grad_accum_steps}

early_stopping:
  _target_: pytorch_lightning.callbacks.EarlyStopping
  monitor: val_loss
  patience: 2000
  mode: min
  verbose: true

checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: ${exp.dir}/${exp.name}/checkpoints
  monitor: val_loss
  mode: min
  verbose: true
  save_top_k: -1
  save_last: false
  filename: 'step={step:06d}-val_loss={val_loss:.4f}'

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: ${exp.dir}/${exp.name}/logs
  name: Apollo

trainer:
  _target_: pytorch_lightning.Trainer
  devices: [0]
  max_epochs: 500
  default_root_dir: ${exp.dir}/${exp.name}/
  accelerator: cuda
  precision: 16-mixed
  limit_train_batches: 1.0
  fast_dev_run: false
  val_check_interval: 306
  check_val_every_n_epoch: null
